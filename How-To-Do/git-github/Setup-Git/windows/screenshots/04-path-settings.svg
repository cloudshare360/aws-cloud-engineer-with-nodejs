<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f4f7fb"/>
  <rect x="120" y="50" width="1040" height="620" rx="18" fill="#ffffff" stroke="#d9e3ef"/>
  <text x="170" y="110" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#1f2937" font-weight="700">Adjusting your PATH environment</text>
  <rect x="170" y="160" width="610" height="280" rx="14" fill="#f9fbff" stroke="#dfeaf9"/>
  <rect x="205" y="200" width="28" height="28" rx="8" fill="#1f6feb"/>
  <text x="250" y="221" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#243244" font-weight="600">Git from the command line and also from 3rd-party software</text>
  <rect x="205" y="255" width="28" height="28" rx="8" fill="#dfeaf9"/>
  <text x="250" y="276" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#5e6f80" font-weight="600">Git from Git Bash only</text>
  <rect x="205" y="310" width="28" height="28" rx="8" fill="#dfeaf9"/>
  <text x="250" y="331" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#5e6f80" font-weight="600">Use Git and optional Unix tools from the Windows Command Prompt</text>
  <text x="205" y="390" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#4b5d6f">Recommended for most users: first option</text>
  <rect x="850" y="170" width="240" height="180" rx="16" fill="#eef5ff" stroke="#dfeaff"/>
  <text x="888" y="235" font-size="26" font-family="Segoe UI, Arial, sans-serif" fill="#1f6feb" font-weight="700">PATH</text>
  <text x="888" y="285" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#425669">Allows Git to be</text>
  <text x="888" y="312" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#425669">available in PowerShell,</text>
  <text x="888" y="339" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#425669">Command Prompt, and VS Code.</text>
  <rect x="170" y="470" width="120" height="44" rx="10" fill="#f0f4fa"/>
  <text x="230" y="500" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#3b4a5c" text-anchor="middle">Back</text>
  <rect x="920" y="470" width="120" height="44" rx="10" fill="#1f6feb"/>
  <text x="980" y="500" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff" text-anchor="middle">Next</text>
  <text x="170" y="610" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#4b5d6f">Screenshot 4: choose the default PATH configuration unless you specifically need a different setup.</text>
</svg>
